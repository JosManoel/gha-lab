name: 02 - Eventos

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Quem você quer cumprimentar?"
        required: true
        default: "turma"
  push:
    paths:
      - "src/**"
  schedule:
    - cron: "*/5 * * * *"  # remova após testar!

jobs:
  cumprimentar:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Olá, $NOME ($GITHUB_EVENT_NAME)"
        env:
          NOME: ${{ inputs.nome || 'agendamento' }}
